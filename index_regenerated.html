<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Lunch Menu Generator</title>
    <!-- Font Awesome 6.4.0 Free (pinned). Every icon name below was verified against this build's all.min.css (.fa-NAME:before rule present). -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.15); width: 90%; max-width: 500px; padding: 30px; text-align: center; }
        h1 { color: #ff6b6b; margin-bottom: 20px; font-size: 2.2rem; }
        .description { color: #555; margin-bottom: 30px; line-height: 1.6; }
        .lunch-display { background: #f8f9fa; border-radius: 15px; padding: 30px; margin: 25px 0; min-height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .food-icon { font-size: 4rem; margin-bottom: 15px; color: #ff6b6b; }
        .food-name { font-size: 2rem; color: #333; font-weight: bold; margin: 10px 0; }
        .generate-btn { background: #ff6b6b; color: #fff; border: none; border-radius: 50px; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255,107,107,.4); }
        .generate-btn:hover { background: #ff5252; }
        .footer { margin-top: 30px; color: #777; font-size: .9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-utensils"></i> Random Lunch Generator</h1>
        <p class="description">Struggling to decide what to eat? Let us choose for you with just one click!</p>
        <div class="lunch-display">
            <div class="food-icon"><i class="fas fa-question"></i></div>
            <div class="food-name">What's for lunch?</div>
        </div>
        <button class="generate-btn" id="generateBtn"><i class="fas fa-shuffle"></i> Generate Lunch!</button>
        <p class="footer">Click the button again if you can't decide!</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const generateBtn = document.getElementById('generateBtn');
            const foodIcon = document.querySelector('.food-icon');
            const foodName = document.querySelector('.food-name');

            // name + icon live in ONE object; icons are from the verified FA 6.4.0 Free list
            const lunchMenu = [
                { name: "Pizza",    icon: "fas fa-pizza-slice" },
                { name: "Sushi",    icon: "fas fa-fish" },
                { name: "Burger",   icon: "fas fa-burger" },
                { name: "Salad",    icon: "fas fa-leaf" },
                { name: "Tacos",    icon: "fas fa-pepper-hot" },   // no taco icon in FA Free; closest food icon
                { name: "Ramen",    icon: "fas fa-bowl-rice" },
                { name: "Sandwich", icon: "fas fa-bread-slice" },
                { name: "Pasta",    icon: "fas fa-wheat-awn" },
                { name: "Curry",    icon: "fas fa-mortar-pestle" },
                { name: "Steak",    icon: "fas fa-drumstick-bite" },
                { name: "Soup",     icon: "fas fa-bowl-food" },
                { name: "BBQ",      icon: "fas fa-fire" }
            ];
            const FALLBACK_ICON = "fas fa-utensils";

            function renderIcon(iconClass) {
                foodIcon.innerHTML = `<i class="${iconClass}"></i>`;
                const el = foodIcon.querySelector('i');
                const glyph = getComputedStyle(el, '::before').content;
                if (glyph === 'none' || glyph === '""') {
                    console.warn(`Icon "${iconClass}" is not in the loaded Font Awesome build; using fallback`);
                    el.className = FALLBACK_ICON;
                }
            }

            let pending = null;   // id of the setTimeout of the last click
            function generateRandomLunch() {
                if (pending !== null) clearTimeout(pending);   // fast repeated clicks: keep only the last result
                const randomIndex = Math.floor(Math.random() * lunchMenu.length); // single draw
                const selected = lunchMenu[randomIndex];
                foodIcon.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                foodName.textContent = "Thinking...";
                pending = setTimeout(() => {
                    renderIcon(selected.icon);
                    foodName.textContent = selected.name;
                    pending = null;
                }, 500);
            }

            generateBtn.addEventListener('click', generateRandomLunch);
            generateRandomLunch();
        });
    </script>
</body>
</html>
